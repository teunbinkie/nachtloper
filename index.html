<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nachtloper</title>
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nachtloper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{
  --bg:#0a0e17; --surface:#131a28; --surface2:#1a2334; --line:#243049;
  --text:#eef2f8; --mute:#8b96ab;
  --lime:#c8f542; --blue:#5ab0ff; --orange:#ff9f43; --pink:#ff5c8a; --grey:#7f8aa3;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;width:100%;user-select:text;-webkit-user-select:text}
input:focus,textarea:focus,select:focus{outline:2px solid var(--lime);outline-offset:1px}
h1,h2,h3,p{margin:0}

#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grey);margin-left:6px;vertical-align:middle}
.syncdot.ok{background:var(--lime)}.syncdot.err{background:var(--pink)}.syncdot.busy{background:var(--orange)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 18px) 18px 24px}
.view{display:none}.view.on{display:block}

.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--lime);font-weight:700}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.chip{font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--surface2);
  border:1px solid var(--line);color:var(--text);white-space:nowrap}
.chip b{color:var(--lime)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.card h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:10px}
.hero{background:radial-gradient(120% 140% at 100% 0%,#22301a 0%,var(--surface) 55%);position:relative;overflow:hidden}
.hero .wk{font-size:13px;color:var(--lime);font-weight:700;letter-spacing:.04em}
.hero .ttl{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:6px 0 4px}
.hero .meta{color:var(--mute);font-size:14px}
.strip{display:flex;gap:3px;height:10px;margin:16px 0 4px;border-radius:6px;overflow:hidden}
.strip i{display:block;border-radius:3px;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;
  font-weight:800;font-size:17px;background:var(--lime);color:#0a0e17;margin-top:16px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--pink);border:1px solid #4a2333}
.btn.small{padding:12px;font-size:15px;margin-top:10px}

.dots{display:flex;gap:8px}
.dot{flex:1;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mute)}
.dot.done{background:var(--lime);color:#0a0e17;border-color:var(--lime)}
.dot.next{border-color:var(--lime);color:var(--lime)}
.tip{font-size:15px;line-height:1.45}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:13px;line-height:1.4;margin-top:4px}

.week{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.week.cur{border-color:#55691f}
.wkhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.wkhead b{font-size:17px}.wkhead span{font-size:12px;color:var(--mute)}
.wknote{padding:0 16px 8px;font-size:12px;color:var(--orange)}
.run{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.run .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#0a0e17}
.run.done .ck{background:var(--lime);border-color:var(--lime)}
.run .rt{flex:1;font-size:15px;font-weight:600;line-height:1.25}
.run .rt small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.run .dur{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.run.race .rt{color:var(--lime)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid .card{margin:0}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bar{flex:1;background:var(--surface2);border-radius:6px;position:relative;overflow:hidden;min-height:6px}
.bar i{position:absolute;left:0;right:0;bottom:0;background:var(--lime);border-radius:6px}
.barlab{display:flex;gap:6px;margin-top:6px}.barlab span{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.log{padding:12px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0}
.log b{font-size:15px}.log p{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.4}

.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{font-size:15px;font-weight:600}.row small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
.row input,.row select{width:auto;max-width:170px}
.row input[type=number]{width:84px;text-align:center}
.sw{width:54px;height:32px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:.18s}
.sw.on{background:var(--lime);border-color:var(--lime)}.sw.on::after{left:25px;background:#0a0e17}

nav{display:flex;background:rgba(13,18,29,.96);border-top:1px solid var(--line);padding:8px 8px calc(var(--sab) + 8px)}
nav button{flex:1;padding:8px 0;font-size:11px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--lime)}

/* run scherm */
#runv{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);z-index:20;display:none;flex-direction:column;
  padding:calc(var(--sat) + 16px) 20px calc(var(--sab) + 20px)}
#runv.on{display:flex}
#runv .rtop{display:flex;justify-content:space-between;align-items:center}
#runv .rtop div{font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.04em}
#runv .rtop b{color:var(--text)}
.ringwrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.ringwrap svg{width:min(84vw,44vh);height:min(84vw,44vh)}
.stats{display:flex;justify-content:space-around;margin:10px 0 2px}
.stat{text-align:center;min-width:30%}.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.stat b.fast{color:var(--orange)}.stat b.good{color:var(--lime)}
.gpsmsg{text-align:center;font-size:12px;color:var(--mute);min-height:16px}
.shift{display:flex;gap:10px}.shift .btn{margin-top:10px}
.mapbox{position:relative}
#map{height:56vh;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#e9eef2}
#map.draw,#map.draw *{touch-action:none!important}
#map .leaflet-control-attribution{font-size:9px}
.kmover{position:absolute;left:10px;top:10px;z-index:500;pointer-events:none;background:rgba(10,14,23,.88);
  border:1px solid var(--line);border-radius:16px;padding:8px 14px 9px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.kmover b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--lime);font-variant-numeric:tabular-nums;line-height:1.1}
.kmover span{font-size:12px;color:var(--mute);font-weight:600}
.snapmsg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:500;pointer-events:none;background:rgba(10,14,23,.88);
  color:var(--text);font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;white-space:nowrap;display:none}
.snapmsg.on{display:block}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.modes button{padding:13px 0;border-radius:12px;font-size:15px;font-weight:800;color:var(--mute)}
.modes button.on{background:var(--lime);color:#0a0e17}
.maptools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.tb{padding:11px 0;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:700}
.tb.on{background:var(--lime);color:#0a0e17;border-color:var(--lime)}
.tb:active{transform:scale(.96)}
.rrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}.rrow button.ld{flex:1;text-align:left}.rrow b{font-size:15px}.rrow small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.rrow .del{color:var(--pink);font-size:13px;font-weight:700;padding:8px}
.warn{color:var(--orange);font-size:13px;line-height:1.4;margin-top:8px}
.ringwrap circle{fill:none}
.c-track{stroke:var(--surface2);stroke-width:16}
.c-ring{stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.c-ttrack{stroke:var(--surface2);stroke-width:3}
.c-tot{stroke:var(--text);stroke-width:3;stroke-linecap:round;opacity:.7}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.center .kind{font-size:17px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.center .time{font-size:min(19vw,10.5vh);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.center .rest{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
#runv.paused .time{opacity:.45}
.nextup{text-align:center;font-size:15px;color:var(--mute);min-height:22px}
.nextup b{color:var(--text)}
.prog{position:relative;margin:14px 0 22px}
.prog .strip{margin:0;height:12px}
.prog .mark{position:absolute;top:-4px;width:3px;height:20px;background:#fff;border-radius:2px;transform:translateX(-1px)}
.ctrl{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.cb{width:60px;height:60px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.cb svg{width:24px;height:24px;fill:var(--text)}
.cb.main{width:86px;height:86px;background:var(--lime);border:0}
.cb.main svg{width:34px;height:34px;fill:#0a0e17}
.cb.stop svg{fill:var(--pink)}
.cb:active{transform:scale(.94)}
.lockhint{text-align:center;font-size:12px;color:var(--mute);margin-top:14px}

/* sheet */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end}
#shade.on{display:flex}
#sheet{background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;
  width:100%;max-height:88vh;overflow-y:auto;padding:22px 20px calc(var(--sab) + 22px)}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
#sheet .sub{margin-bottom:6px}
.seglist{margin:14px 0 4px}
.seg{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.seg i{width:10px;height:10px;border-radius:50%;flex:none}
.seg span{flex:1}.seg em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.field{margin-top:14px}.field label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feel{display:flex;gap:8px}
.feel button{flex:1;padding:12px 0;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:800}
.feel button.on{background:var(--lime);color:#0a0e17;border-color:var(--lime)}
.feelcap{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}
</style>
</head>
<body>
<div id="app">
  <main>
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-stats"></section>
    <section class="view" id="v-routes">
      <div class="top"><div><div class="brand">Plannen</div><h1>Routes</h1></div></div>
      <div class="mapbox"><div id="map"></div>
        <div class="kmover"><b id="rt-km">0,00 km</b><span id="rt-min">ongeveer 0 min</span></div>
        <div class="snapmsg" id="rt-snap"></div></div>
      <div class="modes">
        <button id="m-draw" onclick="setDraw(true)">Tekenen</button>
        <button id="m-look" class="on" onclick="setDraw(false)">Kaart bekijken</button>
      </div>
      <div class="maptools">
        <button class="tb" onclick="rtUndo()">Ongedaan</button>
        <button class="tb" onclick="rtLoop()">Rondje dicht</button>
        <button class="tb" onclick="rtLocate()">Mijn plek</button>
        <button class="tb" id="rt-snapbtn" onclick="setS('snap',!S.settings.snap);rtSnapBtn()">Straten</button>
      </div>
      <div class="card" id="rt-info"></div>
      <div class="card" id="rt-list"></div>
    </section>
    <section class="view" id="v-set"></section>
  </main>
  <nav>
    <button class="on" data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Vandaag</button>
    <button data-v="plan" onclick="go('plan')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schema</button>
    <button data-v="stats" onclick="go('stats')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Voortgang</button>
    <button data-v="routes" onclick="go('routes')"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>Routes</button>
    <button data-v="set" onclick="go('set')"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Instellingen</button>
  </nav>
</div>

<div id="runv">
  <div class="rtop"><div id="r-title"></div><div>Totaal <b id="r-el">0:00</b></div></div>
  <div class="ringwrap">
    <svg viewBox="0 0 300 300">
      <circle class="c-ttrack" cx="150" cy="150" r="145"/>
      <circle class="c-tot" id="r-tot" cx="150" cy="150" r="145" transform="rotate(-90 150 150)"/>
      <circle class="c-track" cx="150" cy="150" r="126"/>
      <circle class="c-ring" id="r-ring" cx="150" cy="150" r="126" transform="rotate(-90 150 150)"/>
    </svg>
    <div class="center">
      <div class="kind" id="r-kind"></div>
      <div class="time" id="r-time">0:00</div>
      <div class="rest" id="r-rest"></div>
    </div>
  </div>
  <div class="stats" id="r-stats"><div class="stat"><b id="r-pace">--:--</b><span>tempo /km</span></div><div class="stat"><b id="r-dist">0,00</b><span>km</span></div><div class="stat"><b id="r-avg">--:--</b><span>gem. dit blok</span></div></div><div class="gpsmsg" id="r-gps"></div>
  <div class="nextup" id="r-next"></div>
  <div class="prog"><div class="strip" id="r-strip"></div><div class="mark" id="r-mark"></div></div>
  <div class="ctrl">
    <button class="cb stop" onclick="askStop()" aria-label="Stoppen"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="cb" onclick="segBack()" aria-label="Blok opnieuw"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="cb main" onclick="togglePause()" aria-label="Pauze"><svg viewBox="0 0 24 24" id="r-pp"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <button class="cb" onclick="segSkip()" aria-label="Volgend blok"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="cb" onclick="toggleVoice()" aria-label="Stem"><svg viewBox="0 0 24 24" id="r-vi"></svg></button>
  </div>
  <div class="lockhint" id="r-hint">Houd het scherm aan: een webapp stopt als je telefoon vergrendelt.</div>
</div>

<div id="shade" onclick="if(event.target===this&&!sheetLocked)closeSheet()"><div id="sheet"></div></div>

<script>
'use strict';
const APP_VERSION='9';
/* ---------- schema ---------- */
const R=m=>({k:'run',s:Math.round(m*60)}), W=m=>({k:'walk',s:Math.round(m*60)}),
      T=m=>({k:'tempo',s:Math.round(m*60)}), SP=s=>({k:'sprint',s:s});
function rep(n,a,b,after){const o=[];for(let i=0;i<n;i++){o.push({...a});if(b&&(i<n-1||after))o.push({...b});}return o;}
const PLAN=[
 {note:'Alles op praattempo: rond 7:00 tot 7:30 per km',runs:[
   {t:'10 min rustig rennen',main:[R(10)]},
   {t:'4x 4 min rennen, 2 min wandelen',main:rep(4,R(4),W(2))},
   {t:'3x 6 min rennen, 2 min wandelen',main:rep(3,R(6),W(2))}]},
 {runs:[
   {t:'3x 7 min rennen, 2 min wandelen',main:rep(3,R(7),W(2))},
   {t:'2x 10 min rennen, 2 min wandelen',main:rep(2,R(10),W(2))},
   {t:'15 min rennen, 2 min wandelen, 10 min rennen',main:[R(15),W(2),R(10)]}]},
 {note:'Vanaf nu zonder wandelpauzes',runs:[
   {t:'2x 12 min rennen, 2 min wandelen',main:rep(2,R(12),W(2))},
   {t:'20 min aan een stuk',main:[R(20)]},
   {t:'25 min aan een stuk',main:[R(25)]}]},
 {runs:[{t:'20 min rustig',main:[R(20)]},{t:'22 min rustig',main:[R(22)]},{t:'30 min rustig (ca. 4 km)',main:[R(30)]}]},
 {note:'Eerste 5 km aan een stuk',runs:[{t:'25 min rustig',main:[R(25)]},{t:'25 min rustig',main:[R(25)]},{t:'35 min rustig (ca. 5 km)',main:[R(35)]}]},
 {runs:[{t:'25 min rustig',main:[R(25)]},{t:'30 min rustig',main:[R(30)]},{t:'40 min rustig (ca. 5,5 km)',main:[R(40)]}]},
 {runs:[{t:'30 min rustig',main:[R(30)]},
   {t:'30 min met 4x 1 min versnellen',main:[R(10),...rep(4,SP(60),R(2),true),R(8)]},
   {t:'45 min rustig (ca. 6,5 km)',main:[R(45)]}]},
 {note:'Herstelweek: bewust minder',runs:[{t:'25 min rustig',main:[R(25)]},{t:'25 min rustig',main:[R(25)]},{t:'40 min rustig',main:[R(40)]}]},
 {note:'Wedstrijdtempo: rond 6:45 tot 7:00 per km',runs:[{t:'30 min rustig',main:[R(30)]},
   {t:'35 min met 3x 4 min wedstrijdtempo',main:[R(10),...rep(3,T(4),R(3),true),R(4)]},
   {t:'55 min rustig (ca. 7,5 km)',main:[R(55)]}]},
 {note:'Langste run van het schema',runs:[{t:'30 min rustig',main:[R(30)]},
   {t:'35 min met 3x 5 min wedstrijdtempo',main:[R(8),...rep(3,T(5),R(3),true),R(3)]},
   {t:'65 min rustig (ca. 9 km)',main:[R(65)]}]},
 {note:'Afbouwen',runs:[{t:'30 min rustig',main:[R(30)]},
   {t:'30 min met 2x 5 min wedstrijdtempo',main:[R(10),...rep(2,T(5),R(3),true),R(4)]},
   {t:'45 min rustig',main:[R(45)]}]},
 {note:'Wedstrijdweek: start rustig, eerste 3 km niet sneller dan 7:00 per km',runs:[
   {t:'25 min rustig',main:[R(25)]},
   {t:'15 min heel rustig met 3 korte versnellingen',main:[R(9),...rep(3,SP(20),{k:'run',s:100},true)]},
   {t:'Nacht van Groningen: 10 km',race:true,main:[{k:'open',s:0}]}]}
];
const ALL=[];PLAN.forEach((w,wi)=>w.runs.forEach((r,ri)=>{r.id=(wi+1)+'-'+(ri+1);r.w=wi+1;r.n=ri+1;ALL.push(r);}));
const KIND={warm:{n:'Warming-up',c:'#7f8aa3'},run:{n:'Rennen',c:'#c8f542'},walk:{n:'Wandelen',c:'#5ab0ff'},
  tempo:{n:'Wedstrijdtempo',c:'#ff9f43'},sprint:{n:'Versnellen',c:'#ff5c8a'},cool:{n:'Cooling-down',c:'#7f8aa3'},open:{n:'Wedstrijd',c:'#c8f542'}};
const TIPS=[
 'Kun je nog een hele zin zeggen tijdens het rennen? Dan zit je goed. Zo niet: langzamer.',
 'De lange run op zondag is de belangrijkste van de week. Sla liever een korte over dan deze.',
 'Houd een rustdag tussen elke run. Je conditie groeit sneller dan je pezen en schenen.',
 'Pijn die erger wordt tijdens het lopen is een stopteken. Spierpijn de dag erna is normaal.',
 'Korte, snelle pasjes belasten je knieen minder dan grote stappen.',
 'In de kou: start met een laagje te veel en loop de eerste minuten extra rustig.',
 'Drink en eet 2 tot 3 uur voor een lange run, niet vlak ervoor.',
 'Een week herhalen is geen stap terug. Het is de snelste weg naar de finish zonder blessure.',
 'Een te snelle start is de meest gemaakte fout op 10 km. De eerste kilometer hoort te makkelijk te voelen.'
];

/* ---------- opslag ---------- */
const KEY='nachtloper.v1';
const DEF={name:'Teun',tomb:{},routes:{},rtomb:{},setUpd:0,sync:null,done:{'1-1':{date:'2026-11-16',secs:622,km:1.75,feel:0,note:'Nachtloop',upd:1},'1-2':{date:'2026-11-17',secs:945,km:2.43,feel:0,note:'Ct5 6',upd:1}},
  settings:{voice:true,voiceName:'',rate:1,beeps:true,cues:true,warm:5,cool:5,gps:true,snap:true,start:'2026-11-16',race:'2027-02-06'},active:null};
let S;try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||!S.settings){S=JSON.parse(JSON.stringify(DEF));}
S.settings=Object.assign({},DEF.settings,S.settings);S.done=S.done||{};S.tomb=S.tomb||{};S.routes=S.routes||{};S.rtomb=S.rtomb||{};S.setUpd=S.setUpd||0;S.name=S.name||'Teun';if(S.sync===undefined)S.sync=null;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){saveLocal();schedulePush();}
function setS(k,v){S.settings[k]=v;S.setUpd=Date.now();save();}

/* ---------- hulpjes ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const fd=d=>d.getDate()+' '+MND[d.getMonth()];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
function mmss(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
function parseT(v){v=String(v).trim();if(!v)return 0;const a=v.split(':').map(Number);if(a.some(isNaN))return 0;
  return a.length===3?a[0]*3600+a[1]*60+a[2]:a.length===2?a[0]*60+a[1]:a[0]*60;}
function say(s){const m=Math.floor(s/60),x=s%60,p=[];
  if(m)p.push(m===1?'1 minuut':m+' minuten');if(x)p.push(x+' seconden');return p.join(' en ');}
const sum=a=>a.reduce((t,x)=>t+x.s,0);
function segsFor(r){const a=[];const st=S.settings;
  if(!r.race&&st.warm>0)a.push({k:'warm',s:st.warm*60});
  r.main.forEach(x=>a.push({...x}));
  if(!r.race&&st.cool>0)a.push({k:'cool',s:st.cool*60});return a;}
const byId=id=>ALL.find(r=>r.id===id);
const nextRun=()=>ALL.find(r=>!S.done[r.id]);
function curWeek(){const d=Math.floor((today()-pd(S.settings.start))/864e5);return Math.min(12,Math.max(1,Math.floor(d/7)+1));}
function weekStart(w){const d=pd(S.settings.start);d.setDate(d.getDate()+(w-1)*7);return d;}
function stripHTML(segs){return segs.map(x=>'<i style="flex:'+(x.s||600)+' 1 0;background:'+KIND[x.k].c+'"></i>').join('');}
function durLabel(r){return r.race?'10 km':Math.round(sum(segsFor(r))/60)+' min';}

/* ---------- navigatie + render ---------- */
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('main').scrollTop=0;renderAll();
  if(v==='routes'){initMap();setTimeout(()=>{if(MAP)MAP.invalidateSize();},60);}}
function renderAll(){renderHome();renderPlan();renderStats();renderSet();renderRoutes();}

function estimate(){const l=Object.entries(S.done).filter(([,d])=>d.km>=2&&d.secs>0).sort((a,b)=>a[1].date<b[1].date?1:-1)[0];
  if(!l)return null;const d=l[1];return {t:d.secs*Math.pow(10/d.km,1.06),pace:d.secs/d.km};}

function renderHome(){
  const n=nextRun(),cw=curWeek(),days=Math.round((pd(S.settings.race)-today())/864e5);
  let h='<div class="top"><div><div class="brand">Nachtloper · '+esc(S.name)+'<span class="syncdot '+syncCls()+'"></span></div><h1>Vandaag</h1></div><div class="chip">'+
    (days>0?'<b>'+days+'</b> dagen tot de start':days===0?'<b>Wedstrijddag</b>':'Wedstrijd geweest')+'</div></div>';
  if(n){const segs=segsFor(n),kinds=[...new Set(segs.map(x=>x.k))];
    h+='<div class="card hero"><div class="wk">WEEK '+n.w+' · RUN '+n.n+(n.n===3&&!n.race?' · LANGE DUURLOOP':'')+'</div>'+
      '<div class="ttl">'+esc(n.t)+'</div><div class="meta">'+(n.race?'Stopwatch met stem, jij bepaalt het einde':
      'Totaal '+Math.round(sum(segs)/60)+' min, inclusief warming-up en cooling-down')+'</div>'+
      '<div class="strip">'+stripHTML(segs)+'</div><div class="legend">'+kinds.map(k=>'<span style="--c:'+KIND[k].c+'">'+KIND[k].n+'</span>').join('')+'</div>'+
      '<button class="btn" onclick="startRun(\''+n.id+'\')">Start training</button></div>';
  }else h+='<div class="card hero"><div class="ttl">Schema afgerond</div><div class="meta">Alle 36 trainingen staan op gedaan. Netjes.</div></div>';
  const wk=PLAN[cw-1];
  h+='<div class="card"><h3>Deze week (week '+cw+')</h3><div class="dots">'+wk.runs.map(r=>
    '<div class="dot '+(S.done[r.id]?'done':(n&&n.id===r.id?'next':''))+'">'+(S.done[r.id]?'Gedaan':'Run '+r.n)+'</div>').join('')+'</div>'+
    (wk.note?'<p class="sub" style="margin-top:10px">'+esc(wk.note)+'</p>':'')+'</div>';
  const e=estimate();
  h+='<div class="card"><h3>Schatting 10 km</h3>'+(e?'<div class="big">'+mmss(e.t)+'</div><p class="sub">Op basis van je laatste gelogde run ('+
    mmss(e.pace)+' per km). Een schatting, geen belofte: runs met wandelpauzes maken hem trager dan je bent.</p>':
    '<p class="sub">Vul na een run je afstand uit Strava in, dan reken ik een verwachte finishtijd uit.</p>')+'</div>';
  const tip=TIPS[Math.floor(Date.now()/864e5)%TIPS.length];
  h+='<div class="card"><h3>Tip van de dag</h3><p class="tip">'+esc(tip)+'</p></div>';
  $('#v-home').innerHTML=h;
}

function shiftWeeks(n){const d=pd(S.settings.start);d.setDate(d.getDate()+7*n);setS('start',iso(d));renderAll();}
function planWarning(){const end=weekStart(12);end.setDate(end.getDate()+5);const race=pd(S.settings.race);
  const diff=Math.round((end-race)/864e5/7);
  if(diff>0)return 'Week 12 valt nu '+diff+(diff===1?' week':' weken')+' na de wedstrijd. Sla dan herstelweek 8 over, of loop 2 runs uit een week en ga door.';
  if(diff<0)return 'Week 12 valt '+(-diff)+(diff===-1?' week':' weken')+' voor de wedstrijd. Herhaal gerust een week.';
  return '';}
function renderPlan(){
  const cw=curWeek();
  let h='<div class="top"><div><div class="brand">12 weken</div><h1>Schema</h1></div><div class="chip"><b>'+
    Object.keys(S.done).filter(k=>byId(k)).length+'</b> / 36 gedaan</div></div>';
  const wn=planWarning();
  h+='<div class="card"><h3>Schema schuiven</h3><p class="sub">Ziek of een drukke week? Schuif alle weken op. Je logboek blijft staan.</p>'+
    (wn?'<p class="warn">'+esc(wn)+'</p>':'')+
    '<div class="shift"><button class="btn ghost small" onclick="shiftWeeks(-1)">1 week eerder</button><button class="btn small" onclick="shiftWeeks(1)">1 week later</button></div></div>';
  PLAN.forEach((w,i)=>{const ws=weekStart(i+1);
    h+='<div class="week'+(i+1===cw?' cur':'')+'"><div class="wkhead"><b>Week '+(i+1)+'</b><span>vanaf ma '+fd(ws)+'</span></div>'+
      (w.note?'<div class="wknote">'+esc(w.note)+'</div>':'');
    w.runs.forEach(r=>{const d=S.done[r.id];
      h+='<button class="run'+(d?' done':'')+(r.race?' race':'')+'" onclick="openRun(\''+r.id+'\')"><span class="ck">'+(d?'&#10003;':'')+'</span>'+
        '<span class="rt">'+esc(r.t)+(d&&d.km?'<small>'+String(d.km).replace('.',',')+' km'+(d.secs?' in '+mmss(d.secs):'')+'</small>':'')+'</span>'+
        '<span class="dur">'+durLabel(r)+'</span></button>';});
    h+='</div>';});
  $('#v-plan').innerHTML=h;
}

function renderStats(){
  const ds=Object.entries(S.done).filter(([k])=>byId(k));
  const km=ds.reduce((t,[,d])=>t+(+d.km||0),0), secs=ds.reduce((t,[,d])=>t+(+d.secs||0),0);
  const longest=ds.reduce((m,[,d])=>Math.max(m,+d.km||0),0);
  let h='<div class="top"><div><div class="brand">Logboek</div><h1>Voortgang</h1></div></div><div class="grid">'+
    '<div class="card"><h3>Trainingen</h3><div class="big">'+ds.length+'<span style="font-size:16px;color:var(--mute)"> / 36</span></div></div>'+
    '<div class="card"><h3>Afstand</h3><div class="big">'+km.toFixed(1).replace('.',',')+'<span style="font-size:16px;color:var(--mute)"> km</span></div></div>'+
    '<div class="card"><h3>Looptijd</h3><div class="big">'+Math.round(secs/60)+'<span style="font-size:16px;color:var(--mute)"> min</span></div></div>'+
    '<div class="card"><h3>Langste run</h3><div class="big">'+longest.toFixed(1).replace('.',',')+'<span style="font-size:16px;color:var(--mute)"> km</span></div></div></div>';
  const plan=PLAN.map(w=>w.runs.reduce((t,r)=>t+(r.race?70*60:sum(r.main)),0)),mx=Math.max(...plan);
  h+='<div class="card"><h3>Minuten per week: gepland en gedaan</h3><div class="bars">'+PLAN.map((w,i)=>{
    const dn=w.runs.reduce((t,r)=>t+(S.done[r.id]?(r.race?70*60:sum(r.main)):0),0);
    return '<div class="bar" style="height:'+Math.round(plan[i]/mx*100)+'%"><i style="height:'+Math.round(dn/plan[i]*100)+'%"></i></div>';}).join('')+
    '</div><div class="barlab">'+PLAN.map((w,i)=>'<span>'+(i+1)+'</span>').join('')+'</div></div>';
  h+='<div class="card"><h3>Logboek</h3>';
  const sorted=ds.sort((a,b)=>a[1].date<b[1].date?1:-1);
  if(!sorted.length)h+='<p class="sub">Nog geen runs gelogd.</p>';
  sorted.forEach(([k,d])=>{const r=byId(k),bits=[];
    if(d.km)bits.push(String(d.km).replace('.',',')+' km');if(d.secs)bits.push(mmss(d.secs));
    if(d.km&&d.secs)bits.push(mmss(d.secs/d.km)+' /km');if(d.feel)bits.push('gevoel '+d.feel+'/5');
    h+='<div class="log" onclick="openRun(\''+k+'\')"><b>'+fd(pd(d.date))+' · week '+r.w+', run '+r.n+'</b><p>'+esc(bits.join(' · ')||r.t)+
      (d.note?'<br>'+esc(d.note):'')+'</p></div>';});
  h+='</div>';$('#v-stats').innerHTML=h;
}

function nlVoices(){try{return speechSynthesis.getVoices().filter(v=>/^nl/i.test(v.lang));}catch(e){return [];}}
function renderSet(){
  const st=S.settings,vs=nlVoices();
  const sw=(k)=>'<button class="sw'+(st[k]?' on':'')+'" onclick="setS(\''+k+'\',!S.settings.'+k+');renderSet()"></button>';
  $('#v-set').innerHTML='<div class="top"><div><div class="brand">Afstellen</div><h1>Instellingen</h1></div></div>'+accountCard()+
   '<div class="card"><h3>Stem en geluid</h3>'+
   '<div class="row"><label>Stem<small>Kondigt elk blok aan</small></label>'+sw('voice')+'</div>'+
   '<div class="row"><label>Tussentijdse meldingen<small>Halverwege, nog 1 minuut, elke 5 min</small></label>'+sw('cues')+'</div>'+
   '<div class="row"><label>Piepjes<small>Aftellen 3, 2, 1 bij een wissel</small></label>'+sw('beeps')+'</div>'+
   '<div class="row"><label>Stemkeuze</label><select onchange="setS(\'voiceName\',this.value)">'+
     '<option value="">Standaard Nederlands</option>'+vs.map(v=>'<option'+(v.name===st.voiceName?' selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select></div>'+
   '<div class="row"><label>Spreeksnelheid</label><input type="range" min="0.8" max="1.3" step="0.05" value="'+st.rate+'" onchange="setS(\'rate\',+this.value)"></div>'+
   '<button class="btn ghost small" onclick="unlockAudio();speak(\'Rennen. 4 minuten. Rustig tempo.\',true);beep(880,.15)">Test stem en piep</button></div>'+
   '<div class="card"><h3>Training</h3>'+
   '<div class="row"><label>Warming-up<small>Minuten wandelen vooraf</small></label><input type="number" min="0" max="15" value="'+st.warm+'" onchange="setS(\'warm\',Math.max(0,+this.value||0));renderAll()"></div>'+
   '<div class="row"><label>Tempo via GPS<small>Live tempo en afstand tijdens de run</small></label>'+sw('gps')+'</div>'+
   '<div class="row"><label>Cooling-down<small>Minuten wandelen na afloop</small></label><input type="number" min="0" max="15" value="'+st.cool+'" onchange="setS(\'cool\',Math.max(0,+this.value||0));renderAll()"></div>'+
   '<div class="row"><label>Start schema<small>Maandag van week 1</small></label><input type="date" value="'+st.start+'" onchange="if(this.value){setS(\'start\',this.value);renderAll()}"></div>'+
   '<div class="row"><label>Wedstrijddatum</label><input type="date" value="'+st.race+'" onchange="if(this.value){setS(\'race\',this.value);renderAll()}"></div></div>'+
   '<div class="card"><h3>Gegevens</h3><p class="sub">Alles staat alleen op dit toestel. Maak af en toe een back-up: iOS kan opslag van webapps wissen.</p>'+
   '<button class="btn ghost small" onclick="backup()">Back-up maken of terugzetten</button>'+
   '<button class="btn danger small" onclick="askReset()">Alles wissen</button></div>'+
   '<p class="sub" style="text-align:center;margin:8px 0 20px">Nachtloper v2 · gemaakt voor de Nacht van Groningen</p>';
}

/* ---------- sheet ---------- */
let sheetLocked=false;
function sheet(html,lock){sheetLocked=!!lock;$('#sheet').innerHTML=html;$('#shade').classList.add('on');}
function closeSheet(){sheetLocked=false;$('#shade').classList.remove('on');}

function openRun(id){
  const r=byId(id),d=S.done[id],segs=segsFor(r);
  let h='<h2>'+esc(r.t)+'</h2><p class="sub">Week '+r.w+', run '+r.n+' · '+durLabel(r)+'</p><div class="seglist">';
  // opeenvolgende gelijke blokken niet samenvoegen: toon ze zoals de timer ze loopt
  segs.forEach(x=>{h+='<div class="seg"><i style="background:'+KIND[x.k].c+'"></i><span>'+KIND[x.k].n+'</span><em>'+(x.s?mmss(x.s):'open')+'</em></div>';});
  h+='</div><button class="btn" onclick="closeSheet();startRun(\''+id+'\')">Start deze training</button>';
  if(d)h+='<button class="btn ghost small" onclick="logSheet(\''+id+'\')">Log aanpassen</button>'+
          '<button class="btn danger small" onclick="unmark(\''+id+'\')">Markeer als niet gedaan</button>';
  else h+='<button class="btn ghost small" onclick="logSheet(\''+id+'\')">Markeer als gedaan</button>';
  sheet(h);
}

let logFeel=0;
function logSheet(id,secs,fresh,gkm){
  const r=byId(id),d=S.done[id]||{};logFeel=d.feel||0;
  const t=d.secs||secs||(r.race?0:sum(r.main));
  sheet('<h2>'+(fresh?'Training klaar':'Run loggen')+'</h2><p class="sub">'+esc(r.t)+'</p>'+
   '<div class="two"><div class="field"><label>Afstand (km)</label><input id="l-km" inputmode="decimal" placeholder="uit Strava" value="'+(d.km?String(d.km).replace('.',','):(gkm?String(gkm).replace('.',','):''))+'"></div>'+
   '<div class="field"><label>Tijd (min:sec)</label><input id="l-t" inputmode="numbers-and-punctuation" value="'+(t?mmss(t):'')+'"></div></div>'+
   '<div class="field"><label>Hoe voelde het?</label><div class="feel" id="l-feel">'+[1,2,3,4,5].map(n=>
     '<button class="'+(n===logFeel?'on':'')+'" onclick="setFeel('+n+')">'+n+'</button>').join('')+'</div>'+
     '<div class="feelcap"><span>zwaar</span><span>makkelijk</span></div></div>'+
   '<div class="field"><label>Notitie</label><textarea id="l-n" rows="2" placeholder="Weer, benen, route">'+esc(d.note||'')+'</textarea></div>'+
   '<button class="btn" onclick="saveLog(\''+id+'\')">Opslaan</button>'+
   (fresh?'<button class="btn ghost small" onclick="closeSheet()">Niet opslaan</button>':''),fresh);
}
function setFeel(n){logFeel=n;document.querySelectorAll('#l-feel button').forEach((b,i)=>b.classList.toggle('on',i+1===n));}
function saveLog(id){
  const old=S.done[id]||{};
  const km=parseFloat(String($('#l-km').value).replace(',','.'))||0;
  S.done[id]={date:old.date||iso(new Date()),km:km,secs:parseT($('#l-t').value),feel:logFeel,note:$('#l-n').value.trim(),upd:Date.now()};delete S.tomb[id];
  save();closeSheet();renderAll();
}
function backup(){
  sheet('<h2>Back-up</h2><p class="sub">Kopieer deze tekst en bewaar hem (bijvoorbeeld in Notities). Terugzetten: plak een eerdere back-up hieronder en tik op Terugzetten.</p>'+
   '<div class="field"><textarea id="b-t" rows="7">'+esc(JSON.stringify({done:S.done,settings:S.settings}))+'</textarea></div>'+
   '<button class="btn" onclick="const t=$(\'#b-t\');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){};this.textContent=\'Gekopieerd\'">Kopieer</button>'+
   '<button class="btn ghost small" onclick="restore()">Terugzetten</button>');
}
function restore(){try{const o=JSON.parse($('#b-t').value);if(!o||typeof o.done!=='object')throw 0;
  const now=Date.now();S.done=o.done;Object.values(S.done).forEach(d=>{d.upd=now;});S.settings=Object.assign({},DEF.settings,o.settings||{});S.setUpd=now;save();closeSheet();renderAll();}
  catch(e){$('#b-t').style.outline='2px solid var(--pink)';}}
function askReset(){sheet('<h2>Alles wissen?</h2><p class="sub">Je logboek en instellingen verdwijnen van dit toestel. Dit kan niet ongedaan worden gemaakt.</p>'+
  '<button class="btn danger" onclick="localStorage.removeItem(KEY);location.reload()">Ja, alles wissen</button><button class="btn ghost small" onclick="closeSheet()">Annuleren</button>');}

/* ---------- stem en geluid ---------- */
let actx=null;
function setAudioSession(){try{if(navigator.audioSession)navigator.audioSession.type='transient';}catch(e){}}
setAudioSession();
function unlockAudio(){setAudioSession();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(f,dur){if(!S.settings.beeps||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=f;o.type='sine';o.connect(g);g.connect(actx.destination);const t=actx.currentTime;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.05);}catch(e){}}
function speak(txt,force){if(!force&&!S.settings.voice)return;if(!('speechSynthesis' in window))return;
  setAudioSession();try{const u=new SpeechSynthesisUtterance(txt);u.lang='nl-NL';u.rate=S.settings.rate||1;
    const vs=nlVoices(),v=vs.find(x=>x.name===S.settings.voiceName)||vs.find(x=>/nl-NL/i.test(x.lang))||vs[0];if(v)u.voice=v;
    if(force)speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{if($('#v-set').classList.contains('on'))renderSet();};


/* ---------- gps-tempo (alleen tonen, de stem zegt het niet) ---------- */
let geoW=null,trk=[];
const TARGET={run:[420,450],tempo:[405,420],open:[400,440]};
function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const s=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function gpsMsg(m){$('#r-gps').textContent=m;}
function gpsStart(){
  trk=[];$('#r-stats').style.display=S.settings.gps?'':'none';gpsMsg('');
  if(!S.settings.gps)return;
  if(!('geolocation' in navigator)){gpsMsg('GPS niet beschikbaar in deze browser');return;}
  if(geoW!==null)return;
  if(!A.m)gpsMsg('GPS zoeken');
  geoW=navigator.geolocation.watchPosition(onPos,err=>{gpsMsg(err.code===1?'Geen toestemming voor locatie. Zet die aan bij Instellingen > Privacy > Locatievoorzieningen > Safari-websites.':'Geen GPS-signaal');},
    {enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function gpsStop(){if(geoW!==null){try{navigator.geolocation.clearWatch(geoW);}catch(e){}}geoW=null;trk=[];}
function onPos(pos){
  if(!A)return;const c=pos.coords,pt={lat:c.latitude,lon:c.longitude,t:pos.timestamp||Date.now()};
  if(c.accuracy>30){gpsMsg('Zwak GPS-signaal ('+Math.round(c.accuracy)+' m)');return;}
  gpsMsg('');
  if(A.pausedAt){A.gl=null;return;}
  const last=A.gl;if(!last){A.gl=pt;return;}
  const d=hav(last,pt),dt=(pt.t-last.t)/1000;if(dt<=0)return;
  if(d<Math.max(3,c.accuracy*0.3))return;      // stilstaan of ruis
  if(d/dt>7){A.gl=pt;return;}                   // onmogelijke sprong
  A.m=(A.m||0)+d;A.gl=pt;trk.push({t:pt.t,m:A.m});
  while(trk.length>2&&pt.t-trk[0].t>40000)trk.shift();
  if(!A.gs||pt.t-A.gs>10000){A.gs=pt.t;saveLocal();}
}
function curPace(){
  if(trk.length<2)return 0;const last=trk[trk.length-1];if(Date.now()-last.t>12000)return 0;
  let first=trk[0];for(const x of trk){if(last.t-x.t<=30000){first=x;break;}}
  const dm=last.m-first.m,dt=(last.t-first.t)/1000;if(dm<20||dt<5)return 0;return dt/(dm/1000);
}
function renderGps(p){
  if(!S.settings.gps)return;
  const m=A.m||0;$('#r-dist').textContent=(m/1000).toFixed(2).replace('.',',');
  const cp=A.pausedAt?0:curPace(),el=$('#r-pace');el.textContent=cp&&cp<1200?mmss(cp):'--:--';
  const tg=TARGET[p.seg.k];el.className=!cp||!tg?'':cp<tg[0]-5?'fast':cp<=tg[1]+15?'good':'';
  const bm=m-(A.bm||0),bt=active()-(A.bt||0);$('#r-avg').textContent=bm>50?mmss(bt/(bm/1000)):'--:--';
}

/* ---------- timer ---------- */
let A=null,SEGS=[],RUN=null,TOTAL=0,timer=null,lastIdx=-1,said=new Set(),wake=null;
const CIRC=2*Math.PI*126,CIRCT=2*Math.PI*145;
$('#r-ring').style.strokeDasharray=CIRC;$('#r-tot').style.strokeDasharray=CIRCT;

async function wakeOn(){try{if('wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');$('#r-hint').textContent='Scherm blijft aan tijdens je training.';}}catch(e){}}
function wakeOff(){try{if(wake)wake.release();}catch(e){}wake=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(A){wakeOn();tick();}sync();}});

function startRun(id,resume){
  RUN=byId(id);if(!RUN)return;SEGS=segsFor(RUN);TOTAL=sum(SEGS);
  unlockAudio();
  if(!resume){A={id:id,start:Date.now(),paused:0,pausedAt:null,skip:0};S.active=A;save();}
  said=new Set();lastIdx=-1;
  $('#r-title').innerHTML='WEEK '+RUN.w+' · RUN '+RUN.n;
  $('#r-strip').innerHTML=stripHTML(SEGS);
  $('#runv').classList.add('on');setPP();setVI();wakeOn();gpsStart();
  clearInterval(timer);timer=setInterval(tick,200);tick();
}
function elapsed(){return ((A.pausedAt||Date.now())-A.start-A.paused)/1000+A.skip;}
function active(){return ((A.pausedAt||Date.now())-A.start-A.paused)/1000;}
function locate(e){let acc=0;for(let i=0;i<SEGS.length;i++){const s=SEGS[i];
  if(s.k==='open')return {i:i,into:e-acc,rem:Infinity,seg:s};
  if(e<acc+s.s)return {i:i,into:e-acc,rem:acc+s.s-e,seg:s};acc+=s.s;}return null;}
function intro(seg){const d=say(seg.s);
  switch(seg.k){
    case 'warm':return 'Warming-up. Wandel '+d+' stevig door.';
    case 'run':return 'Rennen. '+d+'. Rustig tempo.';
    case 'walk':return 'Wandelen. '+d+'.';
    case 'tempo':return 'Wedstrijdtempo. '+d+'. Iets vlotter, maar onder controle.';
    case 'sprint':return 'Versnellen. '+d+'.';
    case 'cool':return 'Cooling-down. Wandel '+d+' uit. Goed gedaan.';
    case 'open':return 'Succes Teun. Begin rustig, de eerste kilometers horen makkelijk te voelen.';
  }return '';}
function tick(){
  if(!A)return;const e=elapsed(),p=locate(e);
  if(!p){complete();return;}
  const k=KIND[p.seg.k],open=p.seg.k==='open',paused=!!A.pausedAt;
  // ring
  const frac=open?((p.into%60)/60):(p.rem/p.seg.s);
  const ring=$('#r-ring');ring.style.stroke=k.c;ring.style.strokeDashoffset=CIRC*(1-(open?frac:Math.max(0,Math.min(1,frac))));
  $('#r-kind').textContent=paused?'Pauze':k.n;$('#r-kind').style.color=k.c;
  $('#r-time').textContent=open?mmss(p.into):mmss(Math.ceil(p.rem));
  $('#r-el').textContent=mmss(active());
  if(open){$('#r-rest').textContent='Tik op stop bij de finish';$('#r-tot').style.strokeDashoffset=CIRCT;$('#r-mark').style.left='0%';$('#r-next').innerHTML='Doel: uitlopen. Tempo rond <b>7:00 per km</b>';}
  else{$('#r-rest').textContent='nog '+mmss(TOTAL-e)+' totaal';$('#r-tot').style.strokeDashoffset=CIRCT*(1-e/TOTAL);
    $('#r-mark').style.left=(e/TOTAL*100)+'%';const nx=SEGS[p.i+1];
    $('#r-next').innerHTML=nx?'Hierna: <b>'+KIND[nx.k].n+'</b> '+mmss(nx.s):'Laatste blok';}
  $('#runv').classList.toggle('paused',paused);
  renderGps(p);
  if(paused)return;
  // meldingen
  if(p.i!==lastIdx){lastIdx=p.i;A.bm=A.m||0;A.bt=active();if(p.into<8){speak(intro(p.seg),true);beep(1175,.35);}}
  if(open){const m=Math.floor(p.into/300);if(m>0&&!said.has('o'+m)&&p.into-m*300<5){said.add('o'+m);if(S.settings.cues)speak(say(m*300)+' gelopen.');}return;}
  const key=p.i+':';
  if(S.settings.cues){
    if(p.seg.s>=180&&p.rem<=60&&p.rem>50&&!said.has(key+'m1')){said.add(key+'m1');speak('Nog 1 minuut.');}
    if((p.seg.k==='run')&&p.seg.s>=600){const m=Math.floor(p.into/300);
      if(m>0&&!said.has(key+'f'+m)&&p.into-m*300<5&&p.rem>90){said.add(key+'f'+m);speak('Nog '+say(Math.round(p.rem/60)*60)+' rennen. Houd het rustig.');}}
    if(TOTAL>=900&&e>=TOTAL/2&&e<TOTAL/2+5&&!said.has('half')){said.add('half');speak('Je bent op de helft.');}
  }
  [3,2,1].forEach(n=>{if(p.rem<=n&&p.rem>n-.6&&!said.has(key+'b'+n)){said.add(key+'b'+n);beep(784,.12);}});
}
function setPP(){$('#r-pp').innerHTML=A&&A.pausedAt?'<path d="M7 4v16l13-8z"/>':'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';}
function setVI(){$('#r-vi').innerHTML=S.settings.voice?'<path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8v-2a3 3 0 0 0 0-4z"/>':
  '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#eef2f8" stroke-width="2" stroke-linecap="round"/>';}
function toggleVoice(){setS('voice',!S.settings.voice);setVI();if(S.settings.voice)speak('Stem aan.',true);else try{speechSynthesis.cancel();}catch(e){}}
function togglePause(){if(!A)return;unlockAudio();
  if(A.pausedAt){A.paused+=Date.now()-A.pausedAt;A.pausedAt=null;speak('Verder.',true);}
  else{A.pausedAt=Date.now();A.gl=null;speak('Pauze.',true);}
  save();setPP();tick();}
function clearSaid(i){[...said].forEach(k=>{if(k.indexOf(i+':')===0)said.delete(k);});}
function segSkip(){if(!A)return;const p=locate(elapsed());if(!p||p.seg.k==='open')return;A.skip+=p.rem+.01;save();tick();}
function segBack(){if(!A)return;const p=locate(elapsed());if(!p)return;
  if(p.into<4&&p.i>0){A.skip-=p.into+SEGS[p.i-1].s;clearSaid(p.i-1);}else{A.skip-=p.into;}
  clearSaid(p.i);lastIdx=-1;save();tick();}
function stopEngine(){clearInterval(timer);timer=null;wakeOff();gpsStop();A=null;S.active=null;save();$('#runv').classList.remove('on');}
function mainDone(){ // seconden in het hoofddeel
  const e=elapsed();if(RUN.race)return Math.round(active());
  const warm=SEGS[0].k==='warm'?SEGS[0].s:0;return Math.round(Math.max(0,Math.min(sum(RUN.main),e-warm)));}
function gpsKm(){return A&&A.m>50?Math.round(A.m/10)/100:0;}
function complete(){const id=RUN.id,secs=sum(RUN.main),km=gpsKm();speak('Training klaar. Goed gedaan.',true);beep(1319,.5);
  stopEngine();renderAll();logSheet(id,secs,true,km);}
function askStop(){if(!A)return;const was=A.pausedAt;if(!was){A.pausedAt=Date.now();setPP();tick();}
  sheet('<h2>'+(RUN.race?'Gefinisht?':'Training stoppen?')+'</h2><p class="sub">'+mmss(active())+' bezig.</p>'+
   '<button class="btn" onclick="finishNow()">'+(RUN.race?'Finish: opslaan':'Opslaan als gedaan')+'</button>'+
   '<button class="btn ghost small" onclick="resumeFromStop()">Doorgaan</button>'+
   '<button class="btn danger small" onclick="closeSheet();stopEngine();renderAll()">Stoppen zonder opslaan</button>',true);}
function resumeFromStop(){closeSheet();if(A&&A.pausedAt){A.paused+=Date.now()-A.pausedAt;A.pausedAt=null;save();setPP();tick();}}
function finishNow(){const id=RUN.id,secs=mainDone(),km=gpsKm();if(RUN.race)speak('Gefinisht. Gefeliciteerd.',true);stopEngine();renderAll();logSheet(id,secs,true,km);}


/* ---------- account en synchronisatie via een GitHub-gist ---------- */
const GH='https://api.github.com',GFILE='nachtloper-data.json';
let syncing=false,syncAgain=false,syncMsg='',syncErr=false,pushT=null,lastPayload=null;
function payload(){return {v:3,name:S.name,done:S.done,tomb:S.tomb,routes:S.routes,rtomb:S.rtomb,settings:S.settings,setUpd:S.setUpd};}
function syncCls(){if(!S.sync||!S.sync.token)return '';if(syncing)return 'busy';return syncErr?'err':(S.sync.last?'ok':'');}
function setSync(m,err){syncMsg=m;syncErr=!!err;const d=document.querySelectorAll('.syncdot');d.forEach(e=>e.className='syncdot '+syncCls());
  const s=$('#syncmsg');if(s)s.textContent=m;}
async function gh(path,opt){opt=opt||{};const hd={'Authorization':'Bearer '+S.sync.token,'Accept':'application/vnd.github+json'};
  if(opt.body)hd['Content-Type']='application/json';
  const r=await fetch(GH+path,{method:opt.method||'GET',headers:hd,body:opt.body,cache:'no-store'});
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e;}return r.status===204?null:r.json();}
function mergeMap(lo,ro,lt,rt){
  const ids=new Set([...Object.keys(lo),...Object.keys(ro),...Object.keys(lt),...Object.keys(rt)]);
  ids.forEach(id=>{
    let best={t:-1,v:undefined};
    [[lo[id],lo[id]&&(lo[id].upd||0)],[ro[id],ro[id]&&(ro[id].upd||0)],[null,lt[id]],[null,rt[id]]].forEach(([v,t])=>{
      if(t===undefined||t===null||v===undefined)return;if(t>best.t)best={t:t,v:v};});
    if(best.v)lo[id]=best.v;else if(best.v===null)delete lo[id];
    const tm=Math.max(lt[id]||0,rt[id]||0);if(tm)lt[id]=tm;
  });
}
function mergeRemote(rem){
  if(!rem||typeof rem!=='object')return;
  mergeMap(S.done,rem.done||{},S.tomb,rem.tomb||{});
  mergeMap(S.routes,rem.routes||{},S.rtomb,rem.rtomb||{});
  if((rem.setUpd||0)>S.setUpd){S.settings=Object.assign({},DEF.settings,rem.settings||{});S.name=rem.name||S.name;S.setUpd=rem.setUpd;}
}
async function findGist(){
  for(let pg=1;pg<=5;pg++){const l=await gh('/gists?per_page=100&page='+pg);
    const g=l.find(x=>x.files&&x.files[GFILE]);if(g)return g.id;if(l.length<100)break;}
  const n=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Nachtloper: hardloopvoortgang van '+S.name,public:false,
    files:{[GFILE]:{content:JSON.stringify(payload())}}})});
  return n.id;
}
async function sync(){
  if(!S.sync||!S.sync.token)return;
  if(syncing){syncAgain=true;return;}
  syncing=true;setSync('Bezig met synchroniseren');
  try{
    if(!S.sync.gistId){S.sync.gistId=await findGist();saveLocal();}
    const g=await gh('/gists/'+S.sync.gistId);const f=g.files&&g.files[GFILE];let rem=null;
    if(f){let t=f.content;if(f.truncated)t=await (await fetch(f.raw_url,{cache:'no-store'})).text();try{rem=JSON.parse(t);}catch(e){}}
    const before=JSON.stringify(payload());mergeRemote(rem);const after=JSON.stringify(payload());
    if(before!==after){saveLocal();if(!document.querySelector('#shade.on'))renderAll();}
    if(!rem||JSON.stringify(rem)!==after)await gh('/gists/'+S.sync.gistId,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:after}}})});
    lastPayload=after;S.sync.last=Date.now();saveLocal();
    syncing=false;setSync('Gesynchroniseerd om '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    syncing=false;
    if(e.status===404){S.sync.gistId=null;saveLocal();setSync('Opslagbestand niet gevonden, probeer opnieuw',true);}
    else if(e.status===401)setSync('Token ongeldig of verlopen. Koppel opnieuw.',true);
    else setSync('Geen verbinding. Wordt later bijgewerkt.',true);
  }
  if(syncAgain){syncAgain=false;sync();}
}
function schedulePush(){if(!S.sync||!S.sync.token)return;const p=JSON.stringify(payload());if(p===lastPayload)return;
  clearTimeout(pushT);pushT=setTimeout(sync,2500);}
function accountCard(){
  const on=S.sync&&S.sync.token;
  if(on)return '<div class="card"><h3>Account</h3>'+
    '<div class="row"><label>'+esc(S.name)+'<small>Gekoppeld aan GitHub'+(S.sync.login?' ('+esc(S.sync.login)+')':'')+'</small></label><span class="syncdot '+syncCls()+'"></span></div>'+
    '<p class="sub" id="syncmsg">'+esc(syncMsg||'Je voortgang wordt automatisch bijgewerkt.')+'</p>'+
    '<button class="btn ghost small" onclick="sync()">Nu synchroniseren</button>'+
    '<button class="btn danger small" onclick="disconnect()">Ontkoppelen op dit toestel</button></div>';
  return '<div class="card"><h3>Account</h3><p class="sub">Koppel je GitHub-account om je voortgang op je telefoon en pc gelijk te houden. Gebruik op elk toestel dezelfde token.</p>'+
    '<div class="field"><label>Naam</label><input id="a-name" value="'+esc(S.name)+'"></div>'+
    '<div class="field"><label>GitHub-token (alleen recht "gist")</label><input id="a-tok" type="password" autocomplete="off" placeholder="ghp_..."></div>'+
    '<p class="sub" id="syncmsg" style="color:var(--pink)">'+(syncErr?esc(syncMsg):'')+'</p>'+
    '<button class="btn small" onclick="connect()">Koppelen</button>'+
    '<a class="btn ghost small" style="text-decoration:none" target="_blank" rel="noopener" href="https://github.com/settings/tokens/new?scopes=gist&description=Nachtloper">Token aanmaken op GitHub</a></div>';
}
async function connect(){
  const tok=$('#a-tok').value.trim(),nm=$('#a-name').value.trim()||'Teun';
  if(!tok){setSync('Vul eerst een token in.',true);return;}
  S.sync={token:tok};setSync('Controleren');
  try{const u=await gh('/user');S.sync.login=u.login;}
  catch(e){S.sync=null;saveLocal();setSync(e.status===401?'Deze token werkt niet.':'Geen verbinding met GitHub.',true);renderSet();return;}
  if(nm!==S.name){S.name=nm;S.setUpd=Date.now();}
  saveLocal();renderSet();await sync();renderAll();
}
function disconnect(){S.sync=null;syncMsg='';syncErr=false;saveLocal();renderAll();}
function unmark(id){delete S.done[id];S.tomb[id]=Date.now();save();closeSheet();renderAll();}


/* ---------- routes tekenen ---------- */
let MAP=null,RCASE=null,RLINE=null,RSTART=null,RT={pts:[],strokes:[]},RTID=null,drawMode=false,drawing=false,snapping=false,lastEv=null,panRAF=null;
const RT_PACE=435; // 7:15 per km voor de tijdschatting
const ROUTER='https://routing.openstreetmap.de/routed-foot/route/v1/foot/';
function initMap(){
  if(MAP)return;
  if(!window.L){$('#map').innerHTML='<p class="sub" style="padding:20px">De kaart kon niet laden. Controleer je internetverbinding en open het tabblad opnieuw.</p>';return;}
  MAP=L.map('map',{zoomControl:true,attributionControl:true}).setView([53.2194,6.5665],14);
  MAP.zoomControl.setPosition('topright');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
  RCASE=L.polyline([],{color:'#ffffff',weight:9,opacity:.9,lineJoin:'round',lineCap:'round'}).addTo(MAP);
  RLINE=L.polyline([],{color:'#fc4c02',weight:5,opacity:1,lineJoin:'round',lineCap:'round'}).addTo(MAP);
  RSTART=L.circleMarker([0,0],{radius:7,color:'#ffffff',weight:3,fillColor:'#1f9d55',fillOpacity:1});
  const el=$('#map');
  const skip=e=>e.target.closest&&e.target.closest('.leaflet-control');
  el.addEventListener('pointerdown',e=>{
    if(!drawMode||skip(e)||!e.isPrimary)return;e.preventDefault();e.stopPropagation();
    if(snapping)return;
    drawing=true;lastEv={clientX:e.clientX,clientY:e.clientY};
    try{el.setPointerCapture(e.pointerId);}catch(x){}
    RT.strokes.push(RT.pts.length);addPt(lastEv,true);
    if(!panRAF)panRAF=requestAnimationFrame(panLoop);
  },true);
  el.addEventListener('pointermove',e=>{if(!drawing)return;lastEv={clientX:e.clientX,clientY:e.clientY};addPt(lastEv,false);e.preventDefault();e.stopPropagation();},true);
  const end=e=>{if(!drawing)return;drawing=false;lastEv=null;if(e)e.stopPropagation();finishStroke();};
  el.addEventListener('pointerup',end,true);el.addEventListener('pointercancel',end,true);
  if(RT.pts.length){rtRedraw();MAP.fitBounds(RLINE.getBounds(),{padding:[30,30]});}
  setDraw(drawMode);rtSnapBtn();
}
/* kaart schuift mee als je vinger bij de rand komt */
const EDGE=95,PAN_MAX=3.5; // randzone in px, maximale snelheid in px per frame (ca. 210 px per seconde)
function edgeVec(ev){const r=$('#map').getBoundingClientRect(),m=EDGE,c=v=>Math.max(-m,Math.min(m,v));let dx=0,dy=0;
  if(ev.clientX<r.left+m)dx=c(ev.clientX-(r.left+m));else if(ev.clientX>r.right-m)dx=c(ev.clientX-(r.right-m));
  if(ev.clientY<r.top+m)dy=c(ev.clientY-(r.top+m));else if(ev.clientY>r.bottom-m)dy=c(ev.clientY-(r.bottom-m));
  return [dx,dy];}
function panLoop(){
  if(!drawing||!lastEv){panRAF=null;return;}
  const v=edgeVec(lastEv);
  if(v[0]||v[1]){
    // zacht beginnen: hoe dieper in de randzone, hoe sneller, met een vast maximum
    const sp=c=>Math.sign(c)*PAN_MAX*Math.pow(Math.abs(c)/EDGE,2);
    MAP.panBy([sp(v[0]),sp(v[1])],{animate:false});addPt(lastEv,false);}
  panRAF=requestAnimationFrame(panLoop);
}
function addPt(ev,force){
  const ll=MAP.mouseEventToLatLng(ev),last=RT.pts[RT.pts.length-1];
  if(!force&&last){const a=MAP.latLngToContainerPoint(last),b=MAP.latLngToContainerPoint(ll);if(a.distanceTo(b)<6)return;}
  RT.pts.push([+ll.lat.toFixed(6),+ll.lng.toFixed(6)]);RLINE.setLatLngs(RT.pts);RCASE.setLatLngs(RT.pts);rtInfo();
}
function simplifyStroke(s){
  const seg=RT.pts.slice(s);if(seg.length<3)return;
  const lp=seg.map(p=>MAP.latLngToLayerPoint(p)),sp=L.LineUtil.simplify(lp,2.5);
  RT.pts.length=s;sp.forEach(q=>{const ll=MAP.layerPointToLatLng(q);RT.pts.push([+ll.lat.toFixed(6),+ll.lng.toFixed(6)]);});
}
function snapMsg(t,ms){const e=$('#rt-snap');e.textContent=t||'';e.classList.toggle('on',!!t);if(t&&ms)setTimeout(()=>{if(e.textContent===t)snapMsg('');},ms);}
async function finishStroke(){
  const s=RT.strokes[RT.strokes.length-1];if(s===undefined)return;
  if(RT.pts.length-s<2&&s===0){rtRedraw();return;}
  simplifyStroke(s);rtRedraw();
  if(S.settings.snap)await snapStroke(s);
}
/* getekende lijn naar straten en paden trekken (looproute van OpenStreetMap) */
function samplePts(pts,every){const out=[pts[0]];let acc=0;
  for(let i=1;i<pts.length;i++){acc+=hav({lat:pts[i-1][0],lon:pts[i-1][1]},{lat:pts[i][0],lon:pts[i][1]});
    if(acc>=every){out.push(pts[i]);acc=0;}}
  const l=pts[pts.length-1];if(out[out.length-1]!==l)out.push(l);return out;}
async function routeChunk(wps){
  const url=ROUTER+wps.map(p=>p[1].toFixed(6)+','+p[0].toFixed(6)).join(';')+'?overview=full&geometries=geojson&continue_straight=false';
  const r=await fetch(url);if(!r.ok)throw new Error('http');const j=await r.json();
  if(j.code!=='Ok'||!j.routes||!j.routes[0])throw new Error('geen route');
  return j.routes[0].geometry.coordinates.map(c=>[+c[1].toFixed(6),+c[0].toFixed(6)]);
}
async function snapStroke(s){
  const seg=RT.pts.slice(s);const from=s>0?RT.pts[s-1]:null;
  const path=from?[from,...seg]:seg;if(path.length<2)return;
  const drawn=rtKm(path);if(drawn<0.02)return;
  const wps=samplePts(path,90);
  snapping=true;snapMsg('Straten zoeken');const len=RT.pts.length,nst=RT.strokes.length;
  try{
    let geo=[];
    for(let i=0;i<wps.length-1;i+=59){const part=await routeChunk(wps.slice(i,i+60));geo=geo.length?geo.concat(part.slice(1)):part;}
    if(RT.pts.length!==len||RT.strokes.length!==nst)return;            // intussen gewist of ongedaan
    const routed=rtKm(geo);
    if(routed>drawn*1.8+0.3){snapMsg('Geen weg langs deze lijn, getekende lijn gebruikt',2600);return;}
    RT.pts.length=s;(from?geo.slice(1):geo).forEach(p=>RT.pts.push(p));
    snapMsg('');rtRedraw();
  }catch(e){snapMsg('Straten volgen lukt nu niet, getekende lijn gebruikt',2600);}
  finally{snapping=false;}
}
function rtSnapBtn(){const b=$('#rt-snapbtn');if(!b)return;b.classList.toggle('on',!!S.settings.snap);b.textContent=S.settings.snap?'Straten aan':'Straten uit';}
function rtKm(pts){let m=0;for(let i=1;i<pts.length;i++)m+=hav({lat:pts[i-1][0],lon:pts[i-1][1]},{lat:pts[i][0],lon:pts[i][1]});return m/1000;}
function kmTxt(k){return k.toFixed(2).replace('.',',');}
function setDraw(m){
  drawMode=m;$('#m-draw').classList.toggle('on',m);$('#m-look').classList.toggle('on',!m);
  $('#map').classList.toggle('draw',m);
  if(!MAP)return;['dragging','touchZoom','doubleClickZoom','boxZoom','scrollWheelZoom'].forEach(k=>{if(MAP[k])m?MAP[k].disable():MAP[k].enable();});
}
function rtRedraw(){
  if(!MAP)return;RLINE.setLatLngs(RT.pts);RCASE.setLatLngs(RT.pts);
  if(RT.pts.length){RSTART.setLatLng(RT.pts[0]);if(!MAP.hasLayer(RSTART))RSTART.addTo(MAP);}else if(MAP.hasLayer(RSTART))MAP.removeLayer(RSTART);
  rtInfo();
}
function rtUndo(){if(snapping)return;const s=RT.strokes.pop();if(s===undefined)return;RT.pts.length=s;rtRedraw();}
function rtClear(){if(snapping)return;RT={pts:[],strokes:[]};RTID=null;rtRedraw();}
async function rtLoop(){if(snapping||RT.pts.length<2)return;const f=RT.pts[0];const s=RT.pts.length;RT.strokes.push(s);RT.pts.push([f[0],f[1]]);rtRedraw();
  if(S.settings.snap)await snapStroke(s);}
function rtLocate(){if(!MAP||!('geolocation' in navigator))return;
  navigator.geolocation.getCurrentPosition(p=>{MAP.setView([p.coords.latitude,p.coords.longitude],16);},()=>{},{enableHighAccuracy:true,timeout:10000});}
function rtInfo(){
  const k=rtKm(RT.pts);const kb=$('#rt-km');if(kb){kb.textContent=kmTxt(k)+' km';$('#rt-min').textContent='ongeveer '+Math.round(k*RT_PACE/60)+' min';}
  const el=$('#rt-info');if(!el)return;
  if(!RT.pts.length){el.innerHTML='<h3>Zo werkt het</h3><p class="sub">Zoek je plek op met Kaart bekijken. Tik dan op Tekenen en trek met je vinger je route. Kom je bij de rand, dan schuift de kaart mee. Met Straten aan wordt je lijn langs wegen en paden getrokken.</p>';return;}
  const f=RT.pts[0],l=RT.pts[RT.pts.length-1];
  const back=hav({lat:l[0],lon:l[1]},{lat:f[0],lon:f[1]})/1000;
  const nm=RTID&&S.routes[RTID]?S.routes[RTID].name:'';
  el.innerHTML='<h3>Route</h3><div class="big">'+kmTxt(k)+' km</div>'+
    '<p class="sub">Ongeveer '+Math.round(k*RT_PACE/60)+' min op 7:15 per km'+(back>0.05?' · eindpunt ligt '+kmTxt(back)+' km van de start':'')+'</p>'+
    '<div class="field"><label>Naam</label><input id="rt-name" placeholder="bijv. Noorderplantsoen rondje" value="'+esc(nm)+'"></div>'+
    '<div class="shift"><button class="btn ghost small" onclick="rtClear()">Wissen</button><button class="btn small" onclick="rtSave()">'+(RTID?'Bijwerken':'Opslaan')+'</button></div>';
}
function rtSave(){
  if(RT.pts.length<2)return;const nm=($('#rt-name').value||'').trim()||('Route '+fd(new Date()));
  const id=RTID||('r'+Date.now());
  S.routes[id]={name:nm,pts:RT.pts.slice(),strokes:RT.strokes.slice(),km:+rtKm(RT.pts).toFixed(2),upd:Date.now()};
  delete S.rtomb[id];RTID=id;save();renderRoutes();
}
function rtLoad(id){const r=S.routes[id];if(!r)return;RT={pts:r.pts.slice(),strokes:(r.strokes||[0]).slice()};RTID=id;
  setDraw(false);rtRedraw();if(MAP&&RT.pts.length)MAP.fitBounds(RLINE.getBounds(),{padding:[30,30]});$('main').scrollTop=0;}
function rtDel(id){const r=S.routes[id];if(!r)return;
  sheet('<h2>Route verwijderen?</h2><p class="sub">'+esc(r.name)+' ('+kmTxt(r.km)+' km) verdwijnt van al je toestellen.</p>'+
    '<button class="btn danger" onclick="delete S.routes[\''+id+'\'];S.rtomb[\''+id+'\']=Date.now();if(RTID===\''+id+'\')RTID=null;save();closeSheet();renderRoutes()">Verwijderen</button>'+
    '<button class="btn ghost small" onclick="closeSheet()">Annuleren</button>');}
function renderRoutes(){
  const el=$('#rt-list');if(!el)return;rtInfo();rtSnapBtn();
  const rs=Object.entries(S.routes).sort((a,b)=>a[1].km-b[1].km);
  el.innerHTML='<h3>Opgeslagen routes</h3>'+(rs.length?rs.map(([id,r])=>
    '<div class="rrow"><button class="ld" onclick="rtLoad(\''+id+'\')"><b>'+esc(r.name)+'</b><small>'+kmTxt(r.km)+' km · ongeveer '+Math.round(r.km*RT_PACE/60)+' min</small></button>'+
    '<button class="del" onclick="rtDel(\''+id+'\')">Verwijder</button></div>').join(''):'<p class="sub">Nog geen routes. Teken er een en tik op Opslaan.</p>');
}

/* ---------- start ---------- */
renderAll();
if(S.active&&byId(S.active.id)&&Date.now()-S.active.start<5*3600*1000){A=S.active;startRun(A.id,true);}
else if(S.active){S.active=null;save();}
sync();
/* automatisch bijwerken: nieuwe versie op GitHub = herladen, maar nooit tijdens een training of open venster */
async function checkUpdate(){
  if(location.protocol!=='https:')return;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=(await r.json()).v;
    if(v&&String(v)!==APP_VERSION&&!A&&!document.querySelector('#shade.on')){
      try{const rg=await navigator.serviceWorker.getRegistration();if(rg)await rg.update();}catch(e){}
      location.reload();}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});}
checkUpdate();
</script>
